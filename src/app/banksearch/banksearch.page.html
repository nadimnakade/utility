<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>PinCode Search</ion-title>
  </ion-toolbar>
  </ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <ion-card class="glass-card">
          <ion-card-header>
            <ion-card-title>PinCode Search</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-item>
              <ion-label position="floating">Pin Code</ion-label>
              <ion-input type="text" [(ngModel)]="pinCode" (ngModelChange)="onPinChange($event)"></ion-input>
            </ion-item>
            <table #dataTable class="display" id="dataTable" style="width:100%">
              <thead>
                  <tr>
                    <th>Bank Name</th>
                    <th>Pin Code</th>
                    <th>Address</th>
                    <th>RM Name</th>
                    <th>RM Email</th>
                    <th>RM Contact</th>
                  </tr>
              </thead>
            </table>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
